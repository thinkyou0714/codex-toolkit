name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: ShellCheck
        run: |
          sudo apt-get update -y >/dev/null
          sudo apt-get install -y shellcheck >/dev/null
          # -S warning: enforce warnings/errors, skip benign info notes
          # (runtime `source`, the `bash -c '...'` idiom, safe `A && b || c`).
          # Note: home/scripts/*.sh and tests/*.sh added in 0.2.0 (kill-switch + test_safety).
          shellcheck -S warning \
            scripts/*.sh home/*.sh install.sh uninstall.sh tests/*.sh \
            home/scripts/*.sh \
            repo-template/.codex/skills/lab-research/scripts/*.sh

  smoke:
    # Run on both Linux and macOS so the portable-path/bash-3.2 promises in the
    # scripts are actually exercised, not just asserted.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Smoke test
        run: bash tests/smoke.sh
